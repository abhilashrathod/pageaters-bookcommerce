packages:
  - apps/*
  - packages/*
  - seed
  - e2e

# Install scripts are denied unless a package needs one to work.
allowBuilds:
  '@angular/cli': false # analytics prompt
  '@parcel/watcher': false # prebuilt binary via optional deps
  aws-sdk: false # maintenance notice
  core-js: false # funding notice
  es5-ext: false # postinstall message
  esbuild: false # prebuilt binary via optional deps
  fsevents: false # optional native watcher (legacy chokidar)
  lmdb: false # prebuilt binary via optional deps (Angular build cache)
  msgpackr-extract: false # prebuilt binary via optional deps
  nice-napi: false # optional native addon for piscina (Angular build workers)
  unrs-resolver: false # prebuilt binary via optional deps
