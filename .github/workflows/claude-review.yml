name: Claude review

# Reviews every PR opened from a branch of this repo (fork PRs get no secrets, so they are skipped).
# Posts inline comments on specific lines and one summary comment. It never pushes code.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR against the rules in AGENTS.md. Focus on correctness bugs, security issues,
            broken contracts between apps/* and packages/shared, and missing tests for changed behaviour.
            Skip style nits that lint and prettier already catch.

            Put each finding as an inline comment on the line it concerns. Finish with one short summary
            comment: what the PR does, and whether it looks ready to merge. If nothing is wrong, say so briefly.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
