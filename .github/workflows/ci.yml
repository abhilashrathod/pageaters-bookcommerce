name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, typecheck, test, build (affected)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # turbo --affected compares against this commit: the PR base, or the previous main head on a push.
      TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
      TURBO_TELEMETRY_DISABLED: 1
      # The CMS build validates its env (src/env.ts) but never connects; a local URI that is never reached is enough.
      # PAYLOAD_SECRET is a throwaway generated below. The storefront build needs nothing: with no API or CMS
      # reachable, sitemap.ts and /book-boxes fall back to empty lists and refresh at runtime (revalidate).
      MONGODB_URI: mongodb://127.0.0.1:27017/pageaters_cms
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # full history, so the base commit exists for --affected

      - uses: pnpm/action-setup@v4 # version from package.json packageManager

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # MongoDB binary of the API test harness (apps/api/test/helpers/db.js, MONGODB_VERSION).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-8.2.6

      - run: pnpm install --frozen-lockfile

      - name: Generate a throwaway PAYLOAD_SECRET
        run: echo "PAYLOAD_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: pnpm turbo run lint typecheck test build --affected

  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # scan the whole history

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan history (.gitleaks.toml)
        run: gitleaks git --config .gitleaks.toml --redact --no-banner .
