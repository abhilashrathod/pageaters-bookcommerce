<form *ngIf="isReady" [formGroup]="bundleFormGroup">
  <div class="row">
    <div class="col-12">
      <h1>Update: {{bundle?.title}}</h1>
    </div>
  </div>

  <div class="shadow-sm mb-5 bg-body rounded form-card">
    <div class="row">
      <div class="col-5">
        <div class="mb-4">
          <div *ngIf="!bundle?.poster" class="image-upload-thumbnail" (click)="profileImage.click()">Bundle Poster</div>
          <img *ngIf="bundle?.poster" class="pointer img-fluid img-thumbnail" [src]="bundle?.poster" (click)="profileImage.click()"/>
          <input #profileImage class="d-none" type="file" (change)="previewImage($event)">
        </div>
        <p class="text-center">
          <button mat-stroked-button [color]="'accent'" (click)="uploadImage()">
            Upload
          </button>
        </p>
      </div>
      <div class="col-7">
        <div>
          <mat-form-field class="w-100">
            <mat-label>Title</mat-label>
            <input matInput formControlName="title">
          </mat-form-field>
        </div>

        <div class="row">
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Discount (in %)</mat-label>
              <input matInput formControlName="currentDiscount" readonly>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Price</mat-label>
              <input matInput formControlName="price" readonly>
            </mat-form-field>
          </div>
          <div class="col">
            <mat-form-field class="w-100">
              <mat-label>Members Price</mat-label>
              <input matInput formControlName="membersPrice" readonly>
            </mat-form-field>
          </div>
        </div>

        <div class="mb-3">
          <angular2-multiselect formControlName="books"
                                [data]="books"
                                [settings]="booksDropdownSettings">
            <c-badge>
              <ng-template let-item="item">
                <span class="m-0">{{item.title | titlecase}}</span>
              </ng-template>
            </c-badge>
            <c-search>
              <ng-template>
                <input type="text" [formControl]="searchBooksCtrl"
                       placeholder="Search books"
                       style="border: none;width: 100%; height: 100%;outline: none;"/>
              </ng-template>
            </c-search>
            <c-item>
              <ng-template let-item="item">
                    <span class="m-0">
                      {{item.title | titlecase}}
                    </span>
              </ng-template>
            </c-item>
          </angular2-multiselect>
        </div>

        <div class="mb-3">
          <mat-form-field class="w-100">
            <mat-chip-list #chipList formControlName="tags">
              <mat-chip *ngFor="let tag of tags.value; let idx = index;" (removed)="remove(idx);">
                {{tag }}
                <mat-icon matChipRemove>cancel</mat-icon>
              </mat-chip>

              <input matInput
                     [matChipInputFor]="chipList"
                     placeholder="Tags"
                     (matChipInputTokenEnd)="add($event)">
            </mat-chip-list>
          </mat-form-field>
        </div>

        <div class="mb-3">
          <mat-form-field class="w-100">
            <mat-label>Description</mat-label>
            <textarea matInput
                      cdkTextareaAutosize
                      #autosize="cdkTextareaAutosize"
                      cdkAutosizeMinRows="5"
                      cdkAutosizeMaxRows="15"
                      formControlName="description"></textarea>
          </mat-form-field>
        </div>
      </div>

    </div>
  </div>
</form>

<div class="action-button-row">
  <button class="me-3" mat-fab color="warn" [routerLink]="['/', 'admin', 'bundles']">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <button mat-fab color="primary" (click)="onSubmit()">
    <mat-icon>check</mat-icon>
  </button>
</div>
