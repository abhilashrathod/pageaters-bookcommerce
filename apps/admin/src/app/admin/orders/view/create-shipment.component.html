<form [formGroup]="weightFormGroup" (ngSubmit)="handleSubmit()">
  <h1 mat-dialog-title>Confirm Dimensions</h1>
  <div mat-dialog-content>
    <div class="row">
      <div class="col-6">
        <mat-form-field class="w-100">
          <mat-label>Width</mat-label>
          <input matInput type="numner" placeholder="Width of Package (CM)" formControlName="width" required>
        </mat-form-field>
      </div>
      <div class="col-6">
        <mat-form-field class="w-100">
          <mat-label>Height</mat-label>
          <input matInput type="numner" placeholder="Height of Package (CM)" formControlName="height" required>
        </mat-form-field>
      </div>
    </div>
    <div class="row">
      <div class="col-12">

          <mat-form-field class="w-100">
            <mat-label>Weight</mat-label>
            <input matInput type="numner" placeholder="Weight of Package (GRMS)" formControlName="weight" required>
          </mat-form-field>

      </div>
    </div>

  </div>
  <div mat-dialog-actions>
    <button class="me-3" type="submit" mat-stroked-button color="primary">Send</button>
    <button type="button" mat-stroked-button color="danger" (click)="dialogRef.close()">Close</button>
  </div>
</form>
