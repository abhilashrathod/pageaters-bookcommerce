<nav id="sidebarMenu" class="col-md-3 col-lg-2 d-md-block sidebar collapse" aria-label="Admin sections">
  <ul class="sidebar-nav">
    @for (menuItem of menuItems; track menuItem.title) {
      <li>
        <a class="sidebar-link" [routerLink]="menuItem.path" routerLinkActive="active">
          <mat-icon class="sidebar-icon" aria-hidden="true">{{ menuItem.icon }}</mat-icon>
          <span>{{ menuItem.title }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
