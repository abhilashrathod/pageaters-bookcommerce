<div class="row">
  <div class="col-12">
    <h1>Books</h1>

  </div>
  <div class="col-12">
    <app-entity-table
      [columns]="resourceColumns"
      [getResource]="getAllBaseUrl"
      [searchResource]="searchBaseUrl"
      [viewResource]="viewResourceUrl"
      [deleteResource]="deleteBaseUrl"
      [showTypes]="true"
      [editResource]="editResourceUrl">
    </app-entity-table>
  </div>
</div>

<div class="action-button-row">
  <button mat-fab color="primary" [routerLink]="createResourceUrl">
    <mat-icon>add</mat-icon>
  </button>
</div>
