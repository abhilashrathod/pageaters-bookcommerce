<h1>Deals</h1>
<div class="row">
  <div class="col-3" *ngFor="let deal of deals">
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{deal.priority}} -- {{deal.title}}</mat-card-title>
        <mat-card-subtitle>{{deal.dealId}}</mat-card-subtitle>
      </mat-card-header>
      <img mat-card-image src="{{BASE +'/'+deal.poster}}" alt="{{deal.title}}">
      <mat-card-content>
        <p>{{deal.description}}</p>
      </mat-card-content>
      <mat-card-actions>
        <button mat-button color="primary" [routerLink]="['/', 'admin', 'store', 'deals', 'update', deal._id]">Edit</button>
        <button mat-button color="warn" (click)="handleDelete(deal._id)">Delete</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>


<div class="action-button-row">
  <button class="me-3" mat-fab color="warn" [routerLink]="['/', 'admin', 'store', 'dash']">
    <mat-icon>arrow_back</mat-icon>
  </button>
  <button mat-fab color="primary" [routerLink]="['/', 'admin', 'store', 'deals', 'create']">
    <mat-icon>add</mat-icon>
  </button>
</div>
