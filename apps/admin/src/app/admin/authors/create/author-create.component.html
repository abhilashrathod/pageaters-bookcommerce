<form [formGroup]="authorFormGroup">
  <div class="row">
    <div class="col-12">
      <h1>Add Author</h1>
    </div>
  </div>

  <div class="shadow-sm mb-5 bg-body rounded form-card">
    <div class="row">
      <div class="col-5">
        <div class="mb-4">
          @if (!avatar) {
            <div class="image-upload-thumbnail" (click)="profileImage.click()">Author Profile Picture</div>
          }
          @if (avatar) {
            <img class="pointer img-fluid img-thumbnail" [src]="avatar" (click)="profileImage.click()" />
          }
          <input #profileImage class="d-none" type="file" (change)="previewImage($event)" />
        </div>
        <p class="text-center">
          <button mat-stroked-button [color]="'accent'" (click)="uploadImage()">Upload</button>
        </p>
      </div>
      <div class="col-7">
        <div class="mb-3">
          <mat-form-field class="w-100">
            <mat-label>Name</mat-label>
            <input matInput formControlName="name" />
          </mat-form-field>
        </div>
        <div class="mb-3">
          <angular2-multiselect [data]="books" formControlName="books" [settings]="dropdownSettings">
            <c-badge>
              <ng-template let-item="item">
                <span class="m-0">{{ item.title | titlecase }}</span>
              </ng-template>
            </c-badge>
            <c-search>
              <ng-template>
                <input
                  type="text"
                  [formControl]="searchBooksCtrl"
                  placeholder="Search books"
                  style="border: none; width: 100%; height: 100%; outline: none"
                />
              </ng-template>
            </c-search>
            <c-item>
              <ng-template let-item="item">
                <span class="m-0">
                  {{ item.title | titlecase }}
                </span>
              </ng-template>
            </c-item>
          </angular2-multiselect>
        </div>
        <div class="mb-3">
          <mat-form-field class="w-100">
            <mat-label>Intro</mat-label>
            <textarea
              matInput
              cdkTextareaAutosize
              #autosize="cdkTextareaAutosize"
              cdkAutosizeMinRows="10"
              cdkAutosizeMaxRows="25"
              formControlName="intro"
            ></textarea>
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
</form>
<div class="action-button-row">
  <button class="me-3" mat-fab color="warn" [routerLink]="['/', 'admin', 'authors']">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <button mat-fab color="primary" (click)="onSubmit()">
    <mat-icon>check</mat-icon>
  </button>
</div>
