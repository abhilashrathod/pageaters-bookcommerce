<div *ngIf="isReady">
  <div class="row">
    <div class="col-12">
      <h1>{{details?.user?.fullName}}</h1>
    </div>
  </div>
  <div class="row">
    <div class="col-9">
      <div class="row">
        <div class="col-4">
          <mat-card class="mb-4">
            <mat-card-content>
              <p>Email: {{details?.user?.email}}</p>
              <p>Contact No: {{details?.user?.contactNo}}</p>
            </mat-card-content>
          </mat-card>
        </div>
      </div>
    </div>
  </div>
</div>
