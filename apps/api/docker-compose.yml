version: '2'

services:
  mongodb:
    image: 'mongo:4.0.10'
    # command: [--auth]
    ports:
      - '27018:27017' # host:container
    networks:
      - nodeapp-network
    # mounting volumes does not work in Windows and MacOS for mongodb
    # https://docs.docker.com/samples/library/mongo/ - See 'Caveats'
    volumes:
      - ./data/db:/data/db
    restart: always

  node:
    build: .
    ports:
      - '3001:3000' # host:container
    networks:
      - nodeapp-network
    depends_on:
      - mongodb
    restart: always
    volumes:
      - ./resources:/var/www/resources
    environment:
      - NODE_ENV=development

networks:
  nodeapp-network:
    driver: bridge
